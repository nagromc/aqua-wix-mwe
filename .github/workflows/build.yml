name: run
on: push

jobs:
  scoop:
    runs-on: windows-latest
    steps:
    - name: Remove pre-installed WiX Toolset
      run: choco uninstall --yes wixtoolset

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Scoop
      uses: MinoruSekine/setup-scoop@v4
      with:
        apps: wixtoolset@6.0.2

    - name: Install Wix dependencies
      shell: pwsh
      run: |
        wix extension add -g WixToolset.Util.wixext/6.0.2
        wix extension add -g WixToolset.Ui.wixext/6.0.2
        wix extension list -g

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        java-version: 25
        distribution: temurin

    - name: Show env
      shell: pwsh
      run: |
        echo "where.exe scoop:   $(where.exe scoop)"
        echo "scoop --version:   $(scoop --version)"
        echo "where.exe wix:   $(where.exe wix)"
        echo "wix --version:   $(wix --version)"
        echo "wix extension list -g:   $(wix extension list -g)"
        echo "where.exe java:   $(where.exe java)"
        echo "java -version:   $(java -version)"

    - name: Build
      run: mvn clean package --debug --errors

  aqua:
    runs-on: windows-latest
    env:
      AQUA_LOG_LEVEL: debug
      AQUA_DISABLE_LAZY_INSTALL: true
    steps:
      - name: Remove pre-installed WiX Toolset
        run: choco uninstall --yes wixtoolset

      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: aquaproj/aqua-installer@11dd79b4e498d471a9385aa9fb7f62bb5f52a73c # v4.0.4
        with:
          aqua_version: v2.56.7
          aqua_opts: ""

      - name: Install Wix dependencies
        shell: pwsh
        run: |
          wix extension add -g WixToolset.Util.wixext/6.0.2
          wix extension add -g WixToolset.Ui.wixext/6.0.2
          wix extension list -g

      - name: Force aqua WiX full install
        shell: pwsh
        run: |
          aqua exec -- wix --version

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Add aqua to path
        shell: pwsh
        run: |
          echo "::core.addPath('C:\Users\runneradmin\AppData\Local\aquaproj-aqua\bin')"

      - name: Show env
        shell: pwsh
        run: |
          echo "env var AQUA_LOG_LEVEL:   $env:AQUA_LOG_LEVEL"
          echo "env var PATH:   $env:PATH"
          echo "env var GITHUB_PATH:   $env:GITHUB_PATH"
          echo "where.exe aqua:   $(where.exe aqua)"
          echo "aqua --version:   $(aqua --version)"
          echo "where.exe wix:   $(where.exe wix)"
          echo "wix --version:   $(wix --version)"
          echo "wix extension list -g:   $(wix extension list -g)"
          echo "where.exe java:   $(where.exe java)"
          echo "java -version:   $(java -version)"

      - name: Build
        run: |
          echo "where.exe wix:   $(where.exe wix)"
          echo "wix --version:   $(wix --version)"
          ./mvnw clean package --debug --errors
